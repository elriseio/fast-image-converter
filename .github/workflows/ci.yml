---
name: ci

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  gate:
    name: format / lint / test / release-build / advisory
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy

      - name: Install libwebp + libheif + build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebp-dev \
            libheif-dev libde265-dev dav1d-dev \
            pkg-config build-essential

      - name: Cache Cargo registry + build artefacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install RustSec advisory scanner (binary, NOT a dev-dependency)
        run: |
          cargo install --locked cargo-audit --version "^0.22"

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Strict Clippy (all targets / features)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test (all targets / features)
        run: cargo test --all-targets --all-features

      - name: Release build
        run: cargo build --release

      - name: Dependency advisory scan
        run: cargo audit --deny warnings
