---
name: ci

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # DE-044: libheif-sys requires libheif >= 1.21. Ubuntu 24.04 ships
  # libheif 1.17.x; `scripts/install_libheif.sh` rebuilds it from source
  # into /usr/local. The /usr/local prefix is searched first via this
  # PKG_CONFIG_PATH so the rebuilt libheif.pc wins over any leftover
  # system one.
  PKG_CONFIG_PATH: /usr/local/lib/pkgconfig:/usr/local/share/pkgconfig

jobs:
  gate:
    name: format / lint / test / release-build / advisory
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy

      - name: Install build prerequisites (libwebp + libheif codecs, but NOT libheif-dev)
        run: |
          # DE-044: the apt libheif-dev on Ubuntu 24.04 is 1.17.x, below
          # libheif-sys' >= 1.21 floor. We install the codec dependencies
          # (libde265-dev, libdav1d-dev) and let `install_libheif.sh`
          # rebuild libheif itself from source into /usr/local.
          sudo apt-get update
          sudo apt-get install -y \
            libwebp-dev \
            libde265-dev libdav1d-dev \
            pkg-config build-essential

      - name: Install libheif >= 1.21 (rebuild from source if system is older)
        run: sudo scripts/install_libheif.sh --yes

      - name: Cache Cargo registry + build artefacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install RustSec advisory scanner (binary, NOT a dev-dependency)
        run: |
          cargo install --locked cargo-audit --version "^0.22"

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Strict Clippy (all targets / features)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test (all targets / features)
        run: cargo test --all-targets --all-features

      - name: Release build
        run: cargo build --release

      - name: Dependency advisory scan
        run: cargo audit --deny warnings
