---
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  gate:
    name: pre-release gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy

      - name: Install libwebp + build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebp-dev pkg-config build-essential

      - name: Cache Cargo registry + build artefacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install RustSec advisory scanner
        run: |
          cargo install --locked cargo-audit --version "^0.22"

      - name: Format check (AR-005 gate)
        run: cargo fmt --all -- --check

      - name: Strict Clippy (AR-005 gate)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test (AR-005 gate)
        run: cargo test --all-targets --all-features

      - name: Dependency advisory scan (AR-005 gate)
        run: cargo audit --deny warnings

      - name: Reject forbidden personal host paths (AR-008 AC-4)
        run: |
          set -euo pipefail
          if grep -rInE '/home/alex|/Users/alex' src/ tests/ docs/ scripts/ Cargo.toml Cargo.lock build.rs Makefile rust-toolchain.toml README.md 2>/dev/null; then
            echo "::error::forbidden personal host path detected in tracked source (AR-008 AC-4)"
            exit 1
          fi
          echo "no forbidden personal host paths found in tracked source"

  build:
    name: build + smoke + publish
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy

      - name: Install libwebp + build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebp-dev pkg-config build-essential imagemagick

      - name: Cache Cargo registry + build artefacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build release binaries
        run: cargo build --release --bins

      - name: Measure binary sizes (AR-008 AC-1)
        id: sizes
        run: |
          set -euo pipefail
          main_size=$(stat -c '%s' target/release/convert-to-webp)
          legacy_size=$(stat -c '%s' target/release/gallery-compress)
          echo "convert-to-webp=${main_size}"
          echo "gallery-compress=${legacy_size}"
          echo "main_size=${main_size}" >> "$GITHUB_OUTPUT"
          echo "legacy_size=${legacy_size}" >> "$GITHUB_OUTPUT"

      - name: Generate SHA-256 checksums (AR-008 AC-3)
        run: |
          set -euo pipefail
          cd target/release
          sha256sum convert-to-webp gallery-compress > SHA256SUMS
          cat SHA256SUMS

      - name: Build manifest (AR-008 AC-3)
        run: |
          set -euo pipefail
          version=$(awk -F\" '/^version/ {print $2; exit}' Cargo.toml)
          commit=$(git rev-parse HEAD)
          target_triple=$(rustc -vV | sed -n 's|host: ||p')
          rust_version=$(rustc --version | awk '{print $2}')
          libwebp_version=$(pkg-config --modversion libwebp)
          {
            echo "name=convert-to-webp"
            echo "version=${version}"
            echo "commit=${commit}"
            echo "target=${target_triple}"
            echo "rust_version=${rust_version}"
            echo "libwebp_version=${libwebp_version}"
            echo "binaries=convert-to-webp,gallery-compress"
            echo "main_size_bytes=${{ steps.sizes.outputs.main_size }}"
            echo "legacy_size_bytes=${{ steps.sizes.outputs.legacy_size }}"
            echo "license=MIT"
            echo "schema_version=1"
          } > target/release/build-manifest.txt
          cat target/release/build-manifest.txt

      - name: Smoke test (AR-008 AC-5)
        run: |
          set -euo pipefail
          ./target/release/convert-to-webp --help > /tmp/help.txt
          # Build a tiny JPG fixture with ImageMagick and round-trip it.
          tmp=$(mktemp -d)
          convert -size 64x48 xc:red "$tmp/red.jpg"
          ./target/release/convert-to-webp "$tmp" >/dev/null
          test -f "$tmp/red.webp"
          ./target/release/convert-to-webp --single-file < "$tmp/red.jpg" > /tmp/out.webp
          # exit 0 on success
          rc=$?
          test "$rc" -eq 0
          # Legacy forwarder must still wrap the canonical binary.
          ./target/release/gallery-compress "$tmp" >/dev/null 2>&1 || true
          rm -rf "$tmp" /tmp/out.webp /tmp/help.txt

      - name: Assemble release artefacts
        run: |
          set -euo pipefail
          mkdir -p target/release-dir
          cp target/release/convert-to-webp target/release-dir/convert-to-webp
          cp target/release/gallery-compress target/release-dir/gallery-compress
          cp target/release/SHA256SUMS target/release-dir/SHA256SUMS
          cp target/release/build-manifest.txt target/release-dir/build-manifest.txt
          cp LICENSE target/release-dir/LICENSE
          ls -la target/release-dir/

      - name: Publish GitHub release (AR-008 AC-3, AC-6)
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            target/release-dir/convert-to-webp
            target/release-dir/gallery-compress
            target/release-dir/SHA256SUMS
            target/release-dir/build-manifest.txt
            target/release-dir/LICENSE
          fail_on_unmatched_files: true
          prerelease: false
