---
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  gate:
    name: pre-release gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy

      - name: Install libwebp + build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebp-dev pkg-config build-essential

      - name: Cache Cargo registry + build artefacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install RustSec advisory scanner
        run: |
          cargo install --locked cargo-audit --version "^0.22"

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Strict Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-targets --all-features

      - name: Dependency advisory scan
        run: cargo audit --deny warnings

      - name: Reject forbidden personal host paths
        run: |
          set -euo pipefail
          if grep -rInE '/home/alex|/Users/alex' src/ tests/ docs/ scripts/ Cargo.toml Cargo.lock build.rs Makefile rust-toolchain.toml README.md 2>/dev/null; then
            echo "::error::forbidden personal host path detected in tracked source"
            exit 1
          fi
          echo "no forbidden personal host paths found in tracked source"

  build:
    name: build + smoke + publish
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy

      - name: Install libwebp + build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebp-dev pkg-config build-essential imagemagick

      - name: Cache Cargo registry + build artefacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build release binaries
        run: cargo build --release --bins

      - name: Measure binary sizes
        id: sizes
        run: |
          set -euo pipefail
          # The canonical `fast-image-converter` is the primary
          # release artefact. The two compatibility aliases
          # (`convert-to-webp`, `gallery-compress`) ship alongside
          # it as documented compatibility assets.
          canonical_size=$(stat -c '%s' target/release/fast-image-converter)
          deprecated_size=$(stat -c '%s' target/release/convert-to-webp)
          legacy_size=$(stat -c '%s' target/release/gallery-compress)
          echo "fast-image-converter=${canonical_size}"
          echo "convert-to-webp=${deprecated_size}"
          echo "gallery-compress=${legacy_size}"
          echo "canonical_size=${canonical_size}" >> "$GITHUB_OUTPUT"
          echo "deprecated_size=${deprecated_size}" >> "$GITHUB_OUTPUT"
          echo "legacy_size=${legacy_size}" >> "$GITHUB_OUTPUT"

      - name: Generate SHA-256 checksums
        run: |
          set -euo pipefail
          # The checksum file uses the actual published filenames.
          # The canonical binary is listed first; the compatibility
          # aliases follow in alphabetical order so the manifest +
          # checksums read top-to-bottom in the same order.
          cd target/release
          sha256sum fast-image-converter convert-to-webp gallery-compress > SHA256SUMS
          cat SHA256SUMS

      - name: Build manifest
        run: |
          set -euo pipefail
          version=$(awk -F\" '/^version/ {print $2; exit}' Cargo.toml)
          commit=$(git rev-parse HEAD)
          target_triple=$(rustc -vV | sed -n 's|host: ||p')
          rust_version=$(rustc --version | awk '{print $2}')
          libwebp_version=$(pkg-config --modversion libwebp)
          {
            echo "name=fast-image-converter"
            echo "version=${version}"
            echo "commit=${commit}"
            echo "target=${target_triple}"
            echo "rust_version=${rust_version}"
            echo "libwebp_version=${libwebp_version}"
            echo "binaries=fast-image-converter,convert-to-webp,gallery-compress"
            echo "canonical_size_bytes=${{ steps.sizes.outputs.canonical_size }}"
            echo "deprecated_size_bytes=${{ steps.sizes.outputs.deprecated_size }}"
            echo "legacy_size_bytes=${{ steps.sizes.outputs.legacy_size }}"
            echo "license=MIT"
            echo "schema_version=1"
          } > target/release/build-manifest.txt
          cat target/release/build-manifest.txt

      - name: Smoke test
        run: |
          set -euo pipefail
          # The canonical binary runs the full batch + single-file
          # round-trip; both compatibility aliases must forward to
          # it (same exit code, same outputs) without surfacing as
          # canonical in their own runtime help.
          ./target/release/fast-image-converter --help > /tmp/help.txt
          grep -q '^Usage: fast-image-converter' /tmp/help.txt
          # Build a tiny JPG fixture with ImageMagick and round-trip it.
          tmp=$(mktemp -d)
          convert -size 64x48 xc:red "$tmp/red.jpg"
          ./target/release/fast-image-converter "$tmp" >/dev/null
          test -f "$tmp/red.webp"
          ./target/release/fast-image-converter --single-file < "$tmp/red.jpg" > /tmp/out.webp
          rc=$?
          test "$rc" -eq 0
          # Compatibility aliases must forward to the canonical
          # binary and exit 0; they emit their own one-line
          # deprecation hint on stderr (AC-3 / AC-4 / AC-7).
          ./target/release/convert-to-webp "$tmp" >/dev/null 2> /tmp/ctw.err
          ctw_rc=$?
          grep -q 'deprecated alias' /tmp/ctw.err
          test "$ctw_rc" -eq 0
          ./target/release/gallery-compress "$tmp" >/dev/null 2> /tmp/gc.err
          gc_rc=$?
          grep -q 'legacy alias' /tmp/gc.err
          test "$gc_rc" -eq 0
          rm -rf "$tmp" /tmp/out.webp /tmp/help.txt /tmp/ctw.err /tmp/gc.err

      - name: Assemble release artefacts
        run: |
          set -euo pipefail
          mkdir -p target/release-dir
          # The canonical binary is published first; the
          # compatibility aliases follow in alphabetical order. The
          # artefact dir name preserves the literal binary names so
          # operators can install any of the three via the
          # documented install path.
          cp target/release/fast-image-converter target/release-dir/fast-image-converter
          cp target/release/convert-to-webp target/release-dir/convert-to-webp
          cp target/release/gallery-compress target/release-dir/gallery-compress
          cp target/release/SHA256SUMS target/release-dir/SHA256SUMS
          cp target/release/build-manifest.txt target/release-dir/build-manifest.txt
          cp LICENSE target/release-dir/LICENSE
          ls -la target/release-dir/

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            target/release-dir/fast-image-converter
            target/release-dir/convert-to-webp
            target/release-dir/gallery-compress
            target/release-dir/SHA256SUMS
            target/release-dir/build-manifest.txt
            target/release-dir/LICENSE
          fail_on_unmatched_files: true
          prerelease: false
