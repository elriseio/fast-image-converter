[package]
# AR-009: the canonical product and CLI is fast-image-converter. The
# package metadata must match the canonical identity so downstream
# tooling (`CARGO_BIN_EXE_fast-image-converter`, release artifact
# names, package metadata) sees one stable identity. The legacy
# names survive as thin forwarder binaries below; ADR-0003 captures
# the migration contract.
name = "fast-image-converter"
version = "0.2.0"
edition = "2021"
description = "Batch image-format converter between jpg, png, and webp with portrait/landscape size policy."
license = "MIT"

default-run = "fast-image-converter"

[[bin]]
# Canonical binary. This is the binary every operator-facing script,
# release asset, and consumer integration must reference. Cargo
# exposes its path via `CARGO_BIN_EXE_fast-image-converter`
# (the literal hyphenated bin name; cargo does not normalise
# hyphens to underscores for these environment variables).
name = "fast-image-converter"
path = "src/main.rs"

[[bin]]
# Deprecated compatibility alias for the v0 product name
# (ADR-0003 § Decision § 3). Forwards arguments and exit status to
# the canonical binary; emits a one-line deprecation hint on stderr.
# The forwarder source is `src/bin/convert-to-webp.rs`.
name = "convert-to-webp"
path = "src/bin/convert-to-webp.rs"

[[bin]]
# Legacy compatibility alias retained from the bash + ImageMagick
# origin (ADR-0001 § Decision § 5; ADR-0003 § Decision § 4).
# Forwards arguments and exit status to the canonical binary.
# The forwarder source is `src/bin/gallery-compress.rs`.
name = "gallery-compress"
path = "src/bin/gallery-compress.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# AR-008 AC-1: explicit symbol stripping + abort-on-panic.
# `strip = "symbols"` removes the symbol table from the release
# binary (matches the v0 `fast-image-converter` README claim of
# ~1.6 MB stripped; AR-010 keeps the documented size claim in
# sync with the canonical name). `panic = "abort"` eliminates
# unwinding tables and the `.eh_frame` section, slightly reducing
# binary size at the cost of a process abort (not a clean error
# path) on a panic. The release workflow (AR-008) measures the
# resulting size and the trade-off is documented in RUNBOOK § 8.
strip = "symbols"
panic = "abort"

[dependencies]
# The `image` crate's `webp` feature enables the WebP DECODER (read
# .webp into DynamicImage). The separate `webp` crate below is the
# ENCODER-ONLY binding to libwebp for emitting WebP. The two are
# architecturally distinct: `image::codecs::webp` covers decode,
# `webp::Encoder` covers encode.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
rayon = "1.10"
webp = "0.3"
# `libc` is used by `--report-fd` validation (fcntl / F_GETFL) to
# verify that the operator-supplied fd is open for writing; it is
# already a transitive dep of the `webp` crate (via `webp-sys`) but
# listed explicitly here because the binary uses the symbol
# directly. DE-005 AC-7.
libc = "0.2"

[dev-dependencies]
# `serde_json` powers `tests/json_output.rs` (DE-005 commit 8) —
# the integration tests parse the binary's NDJSON output to verify
# the documented `report-shape.md` schema. Dev-only; the release
# binary is unaffected.
serde_json = "1.0"